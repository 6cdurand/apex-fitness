[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Force AI endpoint to standalone function (Next.js plugin doesn't pass env vars)
[[redirects]]
  from = "/api/generate-workout"
  to = "/.netlify/functions/generate-workout"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
